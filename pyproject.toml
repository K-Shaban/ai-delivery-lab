[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-delivery-lab"
version = "0.1.0"
description = "An end-to-end Data & AI delivery platform demonstrating the path from raw data to production ML and agentic AI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Kourosh S"}
]

dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "openpyxl",
]
[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"